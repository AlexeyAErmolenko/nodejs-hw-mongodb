tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - email
          - isFavourite
          - contactType
          - userId
        properties:
          name:
            description: 'Contacts name'
            type: string
            example: 'Anna Kovalenko'
          phoneNumber:
            description: 'Contacts phoneNumber'
            type: string
            example: '+380000000006'
          email:
            description: 'Contacts email'
            type: string
            example: andriy7@example.com
          isFavourite:
            description: 'Contact is Favourite'
            type: boolean
            example: false
          contactType:
            description: 'Contact Type'
            type: string
            enum: ['work', 'home', 'personal']
          userId:
            description: 'Contacts user id'
            type: string
            example: 68ad9616cd98598a5612e509
          photo:
            description: "Link to contact's photo"
            type: string
            example: https://res.cloudinary.com/dserfv7z4/image/upload/v1756749931/trdpndazqe5dg2zk0i5j.jpg
            format: binary
responses:
  '201':
    description: Creates a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              type: object
              $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
  '404':
    $ref: '../../components/responses/404.yaml'
