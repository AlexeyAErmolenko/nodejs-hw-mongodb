tags:
  - Auth
summary: send reset password
operationId: sendResetPassword
description: 'Send reset password'
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        properties:
          token:
            description: 'token for reset'
            type: string
            example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI2OGIxNzc0NjhlNTI4ODEwODI5YTU0ZmYiLCJlbWFpbCI6InNpcml5aTk3NDNAbm9pZGVtLmNvbSIsImlhdCI6MTc1NjQ5OTUwOCwiZXhwIjoxNzU2NDk5ODA4fQ.IGLGrHVFHkySJluxtmX3PBDMTh0AXX66W8hFFpnoLwI
          password:
            description: 'new password'
            type: string
            example: 236458qwQ
responses:
  '200':
    description: 'Password has been successfully reset!'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Password has been successfully reset!
  '401':
    $ref: '../../components/responses/401.yaml'
  '404':
    $ref: '../../components/responses/404.yaml'
