tags:
  - Auth
summary: send reset e`mail
operationId: sendResetEmail
description: 'Send reset Email'
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        properties:
          email:
            description: 'User email'
            type: string
            example: andriy7@example.com
responses:
  '200':
    description: 'Reset password email was successfully sent!'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Reset password email was successfully sent!
  '401':
    $ref: '../../components/responses/401.yaml'
  '404':
    $ref: '../../components/responses/404.yaml'
