tags:
  - Auth
summary: login user
operationId: loginUser
description: 'Login user'
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        properties:
          email:
            description: 'User email'
            type: string
            example: andriy7@example.com
          password:
            description: 'User password'
            type: string
            example: $2b$10$FBOgCmiA9zoLFcEK2XUsOuiR/xE.ZUxmKZP995UvdxQw6x/g0YLiW
responses:
  '200':
    description: 'Login user'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully logged in an user!
            data:
              type: object
  '401':
    $ref: '../../components/responses/401.yaml'
