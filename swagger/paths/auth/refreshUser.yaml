tags:
  - Auth
summary: refresh user token
operationId: refreshUser
description: 'Refresh user token'
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        properties:
          email:
            description: 'User email'
            type: string
            example: andriy7@example.com
          password:
            description: 'User password'
            type: string
            example: 123456
responses:
  '200':
    description: 'Refresh token'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully refreshed a session!
            data:
              type: object
              example: 'sbHkzN+j37EhkWjJ0xIGXjjcUUSGSty4t4kC9N+A'
  '401':
    $ref: '../../components/responses/401.yaml'
  '404':
    $ref: '../../components/responses/404.yaml'
