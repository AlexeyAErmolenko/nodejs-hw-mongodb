tags:
  - Auth
summary: confirm OAuth
operationId: confirmOAuth
description: 'Confirm OAuth'
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        properties:
          code:
            description: 'code'
            type: string
            example: 4/0AVMBsJi8uX9ZIve2MOWmDdpxgiDHitos5NGzj82SdVEfb9bBjWkHeCeVSp5-OL9vLnZfdg
responses:
  '200':
    description: 'Successfully logged in via Google OAuth!'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully logged in via Google OAuth!
            data:
              type: string
              example: sbHkzN+j37EhkWjJ0xIGXjjcUUSGSty4t4kC9N+A
  '400':
    $ref: '../../components/responses/400.yaml'
