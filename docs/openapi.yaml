openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts book app
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: This is a documentation of Contacts book app
tags:
  - name: Contacts
    description: Operations about contacts.
  - name: Auth
    description: Auth operations.
servers:
  - url: http://localhost:3000
  - url: https://nodejs-hw-mongodb-769h.onrender.com
paths:
  /contacts:
    get:
      $ref: ../swagger/paths/contacts/get.yaml
    post:
      $ref: ../swagger/paths/contacts/post.yaml
  /contacts/{contactId}:
    get:
      $ref: ../swagger/paths/contacts/{contactId}/get.yaml
    patch:
      $ref: ../swagger/paths/contacts/{contactId}/patch.yaml
    put:
      $ref: ../swagger/paths/contacts/{contactId}/put.yaml
    delete:
      $ref: ../swagger/paths/contacts/{contactId}/delete.yaml
  /auth/register:
    post:
      $ref: ../swagger/paths/auth/registerUser.yaml
  /auth/login:
    post:
      $ref: ../swagger/paths/auth/loginUser.yaml
  /auth/refresh:
    post:
      $ref: ../swagger/paths/auth/refreshUser.yaml
  /auth/logout:
    post:
      $ref: ../swagger/paths/auth/logoutUser.yaml
  /auth/sendResetEmail:
    post:
      $ref: ../swagger/paths/auth/sendResetEmail.yaml
  /auth/sendResetPassword:
    post:
      $ref: ../swagger/paths/auth/sendResetPassword.yaml
  /auth/getOAuthUrl:
    get:
      $ref: ../swagger/paths/auth/getOAuthUrl.yaml
  /auth/confirmOAuth:
    get:
      $ref: ../swagger/paths/auth/confirmOAuth.yaml
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
